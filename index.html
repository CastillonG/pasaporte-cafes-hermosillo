<!-- ════════════════════════════════════════════════════════════
     MEJORAS "PREMIUM" — Find My Coffee
     Pega TODO este bloque justo antes de </body> (después del último <script>).
     No reemplaza nada del archivo: sobrescribe funciones en tiempo de ejecución.

     1) Que el usuario sepa qué pasó, pueda deshacerlo y sepa qué sigue
     2) Patrones consistentes (límites con contador y fecha de renovación)
     3) Estados de error / vacío / sin conexión diseñados con el mismo cuidado
     ════════════════════════════════════════════════════════════ -->
<style>
  /* Toast: admite texto largo, acción y variante de error */
  .toast{white-space:normal!important;display:flex;align-items:center;gap:12px;line-height:1.4;
    width:max-content;max-width:min(92vw,440px);bottom:calc(24px + env(safe-area-inset-bottom))!important;}
  .toast.error{background:#8f2d22;}
  .toast-action{flex-shrink:0;border:0;border-radius:10px;padding:8px 12px;background:var(--cream);
    color:var(--espresso);font:800 12px 'DM Sans',sans-serif;cursor:pointer;}
  .toast.error .toast-action{color:#8f2d22;}

  /* Indicador de guardado con estado de error visible */
  .sync-dot.error{background:#c0392b;}

  /* Banner de conexión */
  .net-banner{position:fixed;top:0;left:0;right:0;z-index:10001;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;
    background:#3e1f0e;color:#f5ead8;font:700 13px 'DM Sans',sans-serif;text-align:center;
    transform:translateY(-110%);transition:transform .25s ease;}
  .net-banner.show{transform:none;}
  .net-banner.ok{background:var(--green);}

  /* Búsqueda sin resultados */
  .suggestion.empty{cursor:default;line-height:1.45;}
  .suggestion.empty:hover{background:transparent;}
  .suggestion.empty .sg-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .suggestion.empty button{border:0;border-radius:9px;padding:7px 11px;background:var(--espresso);color:var(--cream);
    font:700 12px 'DM Sans',sans-serif;cursor:pointer;}
  .suggestion.empty button.ghost{background:rgba(122,63,37,.1);color:var(--espresso);}

  /* Tienda: paso de confirmación antes de gastar CoffeePoints */
  .store-buy.confirming{background:var(--stamp-gold)!important;color:#2a140a!important;}

  /* Límite diario de postales: contador + renovación */
  .pc-renew{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:999px;background:rgba(201,162,39,.15);
    color:var(--dark);font:800 12px 'DM Sans',sans-serif;}

  /* Estados vacíos con siguiente paso */
  .empty-next{text-align:center;padding:18px 12px;color:var(--espresso);font-size:13px;line-height:1.5;}
  .empty-next button{margin-top:10px;border:0;border-radius:11px;padding:10px 14px;background:var(--espresso);
    color:var(--cream);font:800 12px 'DM Sans',sans-serif;cursor:pointer;}
</style>

<div class="net-banner" id="net-banner" role="status" aria-live="polite"></div>

<script>
(function(){
  // ─────────────────────────────────────────
  // 0. TOAST con acción (Deshacer / Reintentar / siguiente paso)
  // ─────────────────────────────────────────
  // Mensajes genéricos del código original → versión que dice qué hacer
  const HINTS = {
    'Error al iniciar sesión. Intenta de nuevo.':
      'No se pudo iniciar sesión. Si no se abrió la ventana de Google, permite ventanas emergentes e intenta de nuevo.',
    'Activa el permiso de ubicación para ver tu café más cercano':
      'No tenemos tu ubicación. Actívala en los permisos del navegador; mientras, puedes buscar un café arriba.',
    'No encontré ese café o ubicación.':
      'Ningún café coincide. Prueba con parte del nombre o la colonia.',
    'No encontré esa ubicación.':
      'No encontramos esa sucursal en el mapa. Intenta buscar solo el nombre del café.',
    'No se pudo guardar la configuración':
      'No se pudo guardar el cambio. Revisa tu conexión e inténtalo de nuevo.'
  };
  let toastTimer = null;
  function hideToast(){ const t=document.getElementById('toast'); if(t) t.classList.remove('show'); }

  window.showToast = function(msg, opts = {}){
    const t = document.getElementById('toast'); if(!t) return;
    msg = HINTS[msg] || String(msg);
    const isError = opts.error ?? /^(No se pudo|No pudimos|Error|✕)/.test(msg);
    t.innerHTML = '';
    const span = document.createElement('span'); span.textContent = msg; t.appendChild(span);
    if (opts.action) {
      const b = document.createElement('button');
      b.className = 'toast-action'; b.type = 'button'; b.textContent = opts.action;
      b.onclick = () => { hideToast(); if (opts.onAction) opts.onAction(); };
      t.appendChild(b);
    }
    t.classList.toggle('error', !!isError);
    t.setAttribute('role', isError ? 'alert' : 'status');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, opts.duration || (opts.action ? 6500 : 3500));
  };
  // El buscador del mapa usaba alert(); ahora usa el toast
  window.alert = msg => showToast(String(msg));

  // ─────────────────────────────────────────
  // 1. SELLOS: deshacer al quitar + siguiente paso al sellar
  // ─────────────────────────────────────────
  function syncCheckinButton(name){
    const btn = document.getElementById('checkin-btn');
    if (!btn || !currentCafe || currentCafe.name !== name) return;
    const v = visited[name];
    btn.textContent = v ? 'Quitar sello · ' + getVisitLabel(v) : 'Registrar Visita ☕';
    btn.className = 'checkin-btn ' + (v ? 'visited' : 'unstamped');
  }
  function afterVisitedChange(){
    refreshMarkers(); renderPassport();
    if (window.schedulePublicProfileSync) window.schedulePublicProfileSync();
  }
  async function restoreStamp(name, value){
    const prev = { ...visited };
    visited[name] = value;
    try {
      await window.saveVisitedState();
      syncCheckinButton(name); afterVisitedChange();
      showToast('Sello restaurado ✓');
    } catch (e) {
      visited = prev; syncCheckinButton(name);
      showToast('No se pudo restaurar el sello.', { action:'Reintentar', onAction:()=>restoreStamp(name, value), error:true });
    }
  }

  window.doCheckin = async function(){
    if (!currentCafe) return;
    const cafe = currentCafe, name = cafe.name, prev = { ...visited };
    const removing = !!visited[name];
    const btn = document.getElementById('checkin-btn');
    if (btn) { btn.disabled = true; btn.textContent = removing ? 'Quitando sello…' : 'Guardando sello…'; }
    try {
      if (removing) delete visited[name];
      else {
        const now = new Date();
        visited[name] = { timestamp:now.toISOString(), label:now.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}) };
      }
      await window.saveVisitedState();
      if (!removing && window.handleVisitedUpdateForAnimation) window.handleVisitedUpdateForAnimation(prev, visited);
      syncCheckinButton(name); afterVisitedChange();

      if (removing) {
        showToast(`Quitaste el sello de ${name}.`, { action:'Deshacer', onAction:()=>restoreStamp(name, prev[name]) });
      } else {
        const route = visibleCafes(), n = route.filter(c => visited[c.name]).length;
        const canSend = !isOwnerAccount() && postcardsLeftToday() > 0 && (window.friendsState || []).length > 0;
        showToast(`Sello ${n} de ${route.length} ✓ ${name}`,
          canSend ? { action:'Recomendar', onAction:()=>{ currentCafe = cafe; openPostcardComposer(); } } : {});
      }
    } catch (e) {
      console.error(e);
      visited = prev; syncCheckinButton(name);
      showToast('No se pudo guardar el sello. Tu ruta no cambió.',
        { action:'Reintentar', onAction:()=>{ currentCafe = cafe; window.doCheckin(); }, error:true });
    } finally {
      if (btn) btn.disabled = false;
      syncCheckinButton(name);
    }
  };

  // ─────────────────────────────────────────
  // 2. TIENDA: confirmar antes de gastar + rollback si falla el guardado
  // ─────────────────────────────────────────
  const pendingConfirm = {};
  window.buyOrEquipStoreItem = async function(id, skipConfirm){
    const item = STORE_ITEMS.find(i => i.id === id); if (!item) return;
    const wasOwned = !!ownedStoreItems[id];
    const pts = storePoints(item);

    if (!wasOwned) {
      if (coffeePoints < pts) {
        const faltan = pts - coffeePoints, postales = Math.ceil(faltan / POSTCARD_POINTS);
        showToast(`Te faltan ${faltan} CoffeePoints (${postales} postal${postales===1?'':'es'}). Cada postal da ${POSTCARD_POINTS}.`,
          postcardsLeftToday() ? { action:'Ir al mapa', onAction:()=>{ closeStore(); goHome(); } } : {});
        return;
      }
      if (!skipConfirm && !pendingConfirm[id]) {
        const btn = document.querySelector(`#store-item-${id} .store-buy`);
        if (btn) { btn.classList.add('confirming'); btn.textContent = `¿Confirmar? ${pts} ☕ · te quedan ${coffeePoints - pts}`; }
        pendingConfirm[id] = setTimeout(() => { delete pendingConfirm[id]; renderStore(); }, 4000);
        return;
      }
      clearTimeout(pendingConfirm[id]); delete pendingConfirm[id];
    }

    const snap = { owned:{...ownedStoreItems}, pts:coffeePoints, cos:equippedCosmetic, pet:selectedPet,
                   bg:selectedPassportBackground, stamp:selectedStampStyle };
    if (!wasOwned) { coffeePoints -= pts; ownedStoreItems[id] = { purchasedAt:new Date().toISOString(), points:pts }; }
    if (item.category === 'cosmetics')   equippedCosmetic = id;
    if (item.category === 'pets')        selectedPet = id;
    if (item.category === 'backgrounds') selectedPassportBackground = id;
    if (item.category === 'stamps')      selectedStampStyle = id;

    try {
      if (window.saveStoreCustomization) await window.saveStoreCustomization();
    } catch (e) {
      ownedStoreItems = snap.owned; coffeePoints = snap.pts; equippedCosmetic = snap.cos; selectedPet = snap.pet;
      selectedPassportBackground = snap.bg; selectedStampStyle = snap.stamp;
      renderStore(); renderCoffeePointsCard();
      showToast('No se pudo completar el canje. No se descontaron tus CoffeePoints.',
        { action:'Reintentar', onAction:()=>window.buyOrEquipStoreItem(id, true), error:true });
      return;
    }
    renderStore(); renderCoffeePointsCard(); renderPassportCharacter(); renderPassportBackground();
    renderPassport(); renderAccountCharacter(); renderPetGrid(); renderStampStyleOptions();
    showToast(wasOwned ? `${item.name} equipado ✓` : `Canjeaste ${item.name} ✓ · te quedan ${coffeePoints} ☕`);
  };

  // ─────────────────────────────────────────
  // 3. POSTALES: límite con contador y hora de renovación,
  //    el borrador no se pierde, envío con reintento
  // ─────────────────────────────────────────
  function renewIn(){
    const now = new Date(), midnight = new Date(now); midnight.setHours(24,0,0,0);
    const mins = Math.max(1, Math.round((midnight - now) / 60000)), h = Math.floor(mins/60), m = mins % 60;
    return h ? `${h} h ${m} min` : `${m} min`;
  }

  window.renderCoffeePointsCard = function(){
    const el = document.getElementById('coffeepoints-card'); if (!el) return;
    const used = postcardsUsedToday(), left = postcardsLeftToday();
    const sub = left
      ? `+${POSTCARD_POINTS} por postal · ${used} de ${DAILY_POSTCARDS} postales usadas hoy`
      : `${used} de ${DAILY_POSTCARDS} postales usadas · se renueva en ${renewIn()}`;
    el.innerHTML = `<div class="cp-coin">☕</div><div class="cp-main"><div class="cp-value">${coffeePoints}</div>
      <div class="cp-label">CoffeePoints</div><div class="cp-sub">${sub}</div></div>
      <button class="cp-btn" onclick="openStore()">Canjear</button>`;
  };

  const origRenderComposer = window.renderPostcardComposer;
  window.renderPostcardComposer = function(){
    origRenderComposer();
    if (!(window.friendsState || []).length) {
      const empty = document.querySelector('#postcard-composer .pc-friends .owner-empty');
      if (empty) empty.outerHTML = `<div class="empty-next">Aún no tienes amigos para mandarle la postal.<br>
        <small>Tu calificación se guarda mientras buscas uno.</small><br>
        <button type="button" onclick="closePostcardComposer();openFriendSearch()">Buscar amigos</button></div>`;
    }
  };

  const origOpenComposer = window.openPostcardComposer;
  window.openPostcardComposer = function(){
    const keep = (postcardDraft && currentCafe && postcardDraft.cafe.name === currentCafe.name) ? { ...postcardDraft } : null;
    origOpenComposer();
    if (!postcardsLeftToday()) {
      const p = document.querySelector('#postcard-composer .pc-limit p');
      if (p) p.innerHTML = `Tienes ${DAILY_POSTCARDS} postal al día y ya la usaste. Mañana ganas otros ${POSTCARD_POINTS} CoffeePoints.
        <br><span class="pc-renew">${postcardsUsedToday()} de ${DAILY_POSTCARDS} usadas · se renueva en ${renewIn()}</span>`;
      return;
    }
    if (keep && postcardDraft) { // recupera lo que ya habías calificado
      Object.assign(postcardDraft, { flavor:keep.flavor, ambience:keep.ambience, price:keep.price, level:keep.level, toUid:keep.toUid });
      renderPostcardComposer();
    }
  };

  window.sendPostcard = async function(){
    const d = postcardDraft, btn = document.getElementById('pc-send-btn');
    if (!d || !d.flavor || !d.ambience || !d.price || !d.level || !d.toUid) return;
    if (!navigator.onLine) { showToast('Estás sin conexión. Tu postal sigue aquí; envíala cuando vuelva la señal.', { error:true }); return; }
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      await window.postcardApi.send({ toUid:d.toUid, cafe:d.cafe, flavor:d.flavor, ambience:d.ambience, price:d.price, level:d.level });
      const friend = (window.friendsState || []).find(f => f.uid === d.toUid);
      const tk = todayKey();
      postcardsToday = (postcardDay === tk ? postcardsToday : 0) + 1; postcardDay = tk; coffeePoints += POSTCARD_POINTS;
      try { if (window.saveUserPrefs) await window.saveUserPrefs({ coffeePoints, postcardDay, postcardsToday }); } catch (e) { console.error(e); }
      postcardDraft = null;
      renderCoffeePointsCard();
      document.getElementById('postcard-draft-card')?.classList.add('flying');
      setTimeout(() => { closePostcardComposer();
        showToast(`Postal enviada a ${friend?.displayName || 'tu amigo'} ✈️ · +${POSTCARD_POINTS} CoffeePoints`); }, 850);
    } catch (e) {
      console.error(e);
      btn.disabled = false; btn.textContent = 'Reintentar envío ✈️';
      showToast(e.code === 'permission-denied'
          ? 'No se pudo enviar: faltan permisos. Tu postal no se perdió.'
          : 'No se pudo enviar la postal. Tu calificación sigue aquí.',
        { action:'Reintentar', onAction:()=>window.sendPostcard(), error:true });
    }
  };

  // ─────────────────────────────────────────
  // 4. DESCUENTOS vacíos: explicar cómo se ganan + atajo
  // ─────────────────────────────────────────
  const origRenderDiscounts = window.renderDiscounts || renderDiscounts;
  window.renderDiscounts = function(){
    origRenderDiscounts();
    const target = document.getElementById('discounts-list');
    if (target && !currentDiscounts().length) {
      const count = agapeLoyaltyCount();
      target.innerHTML = `<div class="empty-next" style="padding:40px 16px;">Todavía no tienes descuentos.<br>
        Completa 6 visitas en la tarjeta de lealtad de Ágape Café para ganar un café al 50 %.
        ${findAgapeVisitedEntry() ? `<br><strong>Vas en ${count} de 6.</strong>` : ''}<br>
        <button type="button" onclick="closeDiscounts();goHome();openCafeSheet(encodeURIComponent('Ágape Café'))">Ver Ágape Café</button></div>`;
    }
  };

  // ─────────────────────────────────────────
  // 5. BÚSQUEDA sin resultados: estado vacío con salida
  // ─────────────────────────────────────────
  const input = document.getElementById('searchInput'), sug = document.getElementById('suggestions');
  if (input && sug) input.addEventListener('input', () => setTimeout(() => {
    const q = input.value.trim();
    if (!q || sug.style.display !== 'none') return;
    sug.innerHTML = `<div class="suggestion empty">Ningún café coincide con “${escHtml(q)}”.<br>
      <small>Prueba con parte del nombre o la colonia.${passportModeEnabled ? ' El Modo Pasaporte está ocultando algunos cafés.' : ''}</small>
      <div class="sg-actions"><button type="button" class="ghost" data-a="clear">Limpiar búsqueda</button>
      ${passportModeEnabled ? '<button type="button" data-a="all">Mostrar todos los cafés</button>' : ''}</div></div>`;
    sug.querySelectorAll('button').forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      if (b.dataset.a === 'all') {
        const tg = document.getElementById('passport-mode-toggle'); if (tg) tg.checked = false;
        togglePassportMode(false); input.dispatchEvent(new Event('input'));
      } else { input.value = ''; sug.style.display = 'none'; input.focus(); }
    });
    sug.style.display = 'block';
  }, 0));

  // ─────────────────────────────────────────
  // 6. SIN CONEXIÓN: avisar en vez de fallar en silencio
  // ─────────────────────────────────────────
  const banner = document.getElementById('net-banner');
  function setNet(online){
    if (online) {
      if (!banner.classList.contains('show')) return;
      banner.textContent = 'Conexión recuperada ✓'; banner.classList.add('ok');
      setTimeout(() => banner.classList.remove('show','ok'), 2200);
    } else {
      banner.textContent = 'Sin conexión · Puedes seguir viendo el mapa; lo que guardes se enviará al volver la señal.';
      banner.classList.remove('ok'); banner.classList.add('show');
    }
  }
  addEventListener('online',  () => setNet(true));
  addEventListener('offline', () => setNet(false));
  if (!navigator.onLine) setNet(false);

  // ─────────────────────────────────────────
  // 7. GUARDADO FALLIDO: el punto deja de mentir
  // ─────────────────────────────────────────
  const dot = document.getElementById('sync-dot');
  if (dot) {
    let wasSyncing = false;
    new MutationObserver(() => {
      const c = dot.className;
      if (c.includes('syncing')) { wasSyncing = true; return; }
      if (!wasSyncing) return;
      wasSyncing = false;
      if (c.trim() === 'sync-dot') { dot.classList.add('error'); dot.title = 'No se guardó el último cambio'; }
      else dot.title = 'Progreso guardado';
    }).observe(dot, { attributes:true, attributeFilter:['class'] });
  }

  // ─────────────────────────────────────────
  // 8. ESC siempre te regresa (cierra la ventana de encima)
  // ─────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('survey-popup')?.classList.contains('show')) { closeCafeSurvey(null,'closed'); return; }
    if (document.getElementById('reward-popup')?.classList.contains('show')) { closeRewardPopup(); return; }
    const open = [...document.querySelectorAll('.overlay.open')].filter(o => o.id !== 'store-overlay');
    const top = open[open.length - 1];
    if (top) { if (top.id === 'map-ad-popup-overlay') closeMapAdPopup(); else top.classList.remove('open'); return; }
    document.getElementById('friends-drawer-backdrop')?.classList.remove('open');
    closeMainMenu();
  });
})();
</script>
